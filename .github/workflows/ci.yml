name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feature/**

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Install CMake 4.3
        run: pipx install "cmake==4.3.*"

      - name: Show tool versions
        run: |
          cmake --version
          ninja --version
          $CXX --version

      - name: Configure
        run: cmake --preset debug-asan

      - name: Build
        run: cmake --build --preset debug-asan

      - name: Test
        run: ctest --preset debug-asan
        env:
          ASAN_OPTIONS: detect_leaks=1
